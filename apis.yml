name: VWR International (Avantor)
description: >-
  VWR International, now part of Avantor, is a global distributor of laboratory
  supplies, chemicals, equipment, and services for the life sciences, pharmaceutical,
  biotechnology, and research industries. With over 180 years of history, VWR serves
  more than one million customers in over 30 countries. The company operates as
  Avantor's distribution and procurement platform, providing laboratory consumables,
  reagents, instruments, and cold chain solutions. VWR/Avantor offers e-procurement
  integrations and eProcurement APIs to support laboratory supply chain automation
  for enterprise customers through EDI, OCI/PunchOut, and catalog integration.
